<!DOCTYPE html>

<html>
    <head>
        <link rel="stylesheet" href="../styles/main.css" />
        <link rel="stylesheet" href="../styles/editor_toolbar.css" />
        <link rel="stylesheet" href="../styles/toolbar_menus.css" />
    </head>

    <style>
        html:root {
            --interactables-border: 2px solid #29364A;
        }
    </style>

    <body>
        <template id="toolbar-item-menu"><div class="command-button-list" menu-display-type="block">
            <span class="command-menu-description"></span><!-- Dynamic command buttons -->
        </div></template>

        <div id="editor-toolbar" spellcheck="false">
            <button class="toolbar-button" name="file" data-tooltip="Open Project File">
                <strong>FILE</strong>
            </button>

            <button class="toolbar-button" name="edit" data-tooltip="Project Edit Controls">
                <strong>EDIT</strong>
            </button>

            <button class="toolbar-button" name="settings" data-tooltip="Configure Editor Preferences, ETC">
                <strong>SETTINGS</strong>
            </button>
        </div>

        <script type="module" src="../../lua_block_editor_src/build/main.js"></script>
    </body>
</html>
